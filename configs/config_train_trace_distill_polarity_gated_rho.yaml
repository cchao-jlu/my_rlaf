# @package _global_

defaults:
  - config_train_trace_distill_gated_small_residual
  - _self_

model_name: GNN_Glucose_3SAT_TraceAdapter_PolarityGateMin095
model_dir: runs/${model_name}

# Start from the strongest fixed-rho gated residual adapter and add polarity only
# as a conditional gate.  Matching adapter tensor shapes are loaded; wider
# event-state tensors are prefix-expanded by load_compatible_state_dict.
from_checkpoint: runs/GNN_Glucose_3SAT_TraceAdapter_GatedConflict_Scale025Clip05_RhoGateM024/best.pt

model:
  var_state_dim: 29
  event_adapter:
    enabled: True
    hidden_dim: 128
    fusion: polarity_gated_residual
    delta_scale: 0.25
    delta_clip: 0.5
    residual_state_dim: 20
    # Enhanced conflict/learnt gate: cumulative, delta, rate, rank.
    gate_indices: [2, 3, 7, 8, 12, 13, 17, 18]
    # Polarity extension features: rates and signed biases.
    polarity_gate_indices: [20, 21, 22, 23, 24, 25, 26, 27, 28]
    # Keep the imported fixed-rho adapter close to pass-through at epoch 0.
    polarity_gate_bias_init: 5.0
    # Polarity is only a conservative selector; it cannot shut off the stable
    # fixed-rho residual branch.
    polarity_gate_min: 0.95
    base_rho_gate_threshold: -0.24

trace:
  data_path: "data/trace_distill/train_trace_polarity.pt"
  event_state_features: polarity
  label:
    low_lbd_weight: 0.45
    useful_decision_weight: 0.30
    conflict_rank_weight: 0.25
    propagation_rank_weight: 0.0
    activity_rank_weight: 0.0
    target_scale: 1.0
    target_delta_clip: 0.5

training:
  use_cuda: False
  use_amp: False
  # Keep the fixed-rho residual branch fixed; train only the polarity gate.
  adapter_train_mode: polarity_gate
