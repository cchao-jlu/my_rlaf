# @package _global_

defaults:
  - config_generate_counterfactual_outcome_traces_risk_focused
  - _self_

# 专门为 recovery detector 扩充正例的 400 hard/timeout trace。
# split 由 create_hard_recovery_split.py 生成，包含 raw adapter 已知
# recovered_timeout、lost、both-timeout 等高信息量实例；不使用原 300/350
# heldout_test。

dataset:
  path: "data/selector_splits/3sat/hard_recovery_train/400/*.cnf"
  lazy: True

counterfactual:
  output_path: "data/counterfactual_trace/hard_recovery_400_train_traces.pt"
  output_csv: "data/counterfactual_trace/hard_recovery_400_train_outcomes.csv"
  warmup_stats_csv: "data/counterfactual_trace/hard_recovery_400_train_warmup_stats.csv"
  base_stats_csv: "data/counterfactual_trace/hard_recovery_400_train_base_branch_stats.csv"
  adapter_stats_csv: "data/counterfactual_trace/hard_recovery_400_train_adapter_branch_stats.csv"
  doc_path: "docs/counterfactual_outcome_trace_hard_recovery_400_train.md"
  warmup_conflicts: 2000
  intervention_conflicts: [500, 1000, 2000]
  warmup_cpu_lim: 15
  final_cpu_lim: 60
  # 生成 raw adapter counterfactual，不经过当前 selector。
  disable_adapter_selector: True
  disable_adapter_base_rho_gate: True
  disable_adapter_graph_gate: True
  label:
    positive_speedup_ratio: 0.75
    negative_slowdown_ratio: 1.05
    positive_weight: 4.0
    negative_weight: 8.0
    recovery_weight: 12.0
    lost_weight: 24.0
    speedup_weight: 4.0
    slowdown_weight: 10.0
    easy_slowdown_weight: 16.0
    positive_min_base_time: 10.0
    positive_min_delta_time: 1.0
    negative_min_delta_time: 0.5
    easy_base_time_cutoff: 10.0
    easy_negative_delta_time: 0.25
