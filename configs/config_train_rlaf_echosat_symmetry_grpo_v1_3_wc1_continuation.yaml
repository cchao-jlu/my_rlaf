# @package _global_

defaults:
  - config_train_rlaf_echosat_symmetry_grpo_v1_2_wc1_hardneg_full
  - _self_

model_name: GNN_Glucose_3SAT_EchoSAT_SymmetryGRPO_v1_3_WC1_Continuation
model_dir: runs/${model_name}

# v1.2 time-slice and targeted acceptance selected iter=15 as the wc1 seed.
from_checkpoint: runs/GNN_Glucose_3SAT_EchoSAT_SymmetryGRPO_v1_2_WC1_HardNeg_Full/iter=15.pt

# Validate iteration 0 so the seed checkpoint can remain best if continuation
# starts to erase the wc1 strict search-work behavior.
skip_initial_val: false
val_interval: 5
ckpt_interval: 5

training:
  echosat_target_mode: symmetry_grpo_v1_3
  best_checkpoint_metric: echosat_strict_search_work

  # Formal controlled continuation: same batch/sample scale as prior full
  # symmetry GRPO runs, but shorter than another 240/2000-iteration pass.
  iterations: 120
  cnf_per_iter: 48
  steps_per_iter: 48
  num_samples: 16

  # Keep the validated low-cost setting as the main objective.
  feedback_input_mode: model_warmup
  feedback_val_mode: model_warmup
  feedback_model_warmup_prob: 1.0
  feedback_warmup_budget_type: conflicts
  feedback_warmup_conflicts: 1
  feedback_warmup_cpu_lim: 5

  # Preserve the anchor behavior found at v1.2 iter=15, while keeping k10/php10
  # and the subset permutation failure as hard negatives.
  echosat_anchor_base_ids:
    - k9_color8
    - php_p9_h8
  echosat_anchor_failure_penalty_weight: 2.0
  echosat_anchor_failure_floor: 0.25

  echosat_hard_negative_base_ids:
    - k10_color9
    - php_p10_h9
    - subset_cardinality_bw12
  echosat_hard_negative_penalty_weight: 3.0

  echosat_subset_failure_base_id: subset_cardinality_bw12
  echosat_subset_failure_variant: perm_seed1730
  echosat_suppress_subset_failure_positive: true
  echosat_subset_failure_penalty_weight: 3.0
  echosat_subset_failure_floor: 1.0

  # Strict search-work objective. CPU remains disabled as positive reward.
  echosat_decisions_weight: 0.55
  echosat_conflicts_weight: 0.45
  echosat_final_cpu_weight: 0.0
  echosat_search_eps_decisions: 0.0
  echosat_search_eps_conflicts: 0.0
  echosat_decision_blowup_penalty_weight: 2.5
  echosat_conflict_blowup_penalty_weight: 2.5

  # Random controls remain penalty-only and cannot receive positive advantage.
  echosat_random_control_penalty_weight: 5.0
  echosat_control_penalty_weight: 2.5
  echosat_large_weight_phase_shift_penalty_weight: 1.25
  echosat_control_weight_delta_weight: 2.5
  echosat_control_phase_flip_weight: 2.5
  echosat_control_rank_change_weight: 1.25
  echosat_control_advantage_weight: 0.0

  # Keep order/pair inconsistency penalties active. Multi-warmup consistency is
  # checked by the offline v1.3 objective audit, not by the single-warmup train
  # batch.
  echosat_permutation_delta_weight: 3.0
  echosat_mixed_group_negative_scale: 2.0
  echosat_mixed_group_positive_scale: 1.0
  echosat_suppress_mixed_group_positive: true

optim:
  lr: 3.0e-6
  weight_decay: 0.0

wandb:
  mode: disabled
