# @package _global_

defaults:
  - config_train_trace_distill_gated
  - _self_

model_name: GNN_Glucose_3SAT_TraceAdapter_SBEPolarity
model_dir: runs/${model_name}

model:
  var_state_dim: 29
  event_adapter:
    enabled: True
    hidden_dim: 128
    fusion: sbe
    delta_scale: 0.25
    delta_clip: 0.5
    # Keep the existing conflict/learnt gate indices from the first 20 enhanced
    # features; polarity features are consumed by the SBE dynamic branch.
    gate_indices: [2, 3, 7, 8, 12, 13, 17, 18]

trace:
  event_state_features: polarity

training:
  use_cuda: False
  use_amp: False
