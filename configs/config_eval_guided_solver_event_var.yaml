# @package _global_

defaults:
  - config_eval_guided_solver
  - _self_

feedback_refinement:
  enabled: True
  state_type: event_var
  event_state_features: enhanced
  # Empirically best on data/test/3sat/300 after gated residual adapter:
  # one conflict-budgeted rollout gives most of the search signal with less overhead.
  num_rounds: 1
  state_momentum: 0.5
  rollout_budget_type: conflicts
  rollout_conflicts: 500
  warmup_cpu_lim: 10
